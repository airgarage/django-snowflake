name: Linters

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/linters.yml'

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: uv sync --only-group dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
